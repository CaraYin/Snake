<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  :root {
    --bg: #0f172a;
    --board-bg: #1e293b;
    --grid-line: #27334a;
    --snake-head: #4ade80;
    --snake-body: #22c55e;
    --food: #f87171;
    --text: #e2e8f0;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
    gap: 12px;
  }
  h1 {
    margin: 0;
    font-size: 1.8rem;
    letter-spacing: 0.05em;
  }
  .hud {
    display: flex;
    gap: 24px;
    font-size: 1.1rem;
  }
  .hud span {
    color: var(--accent);
    font-weight: bold;
  }
  .game-area {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  #board {
    background: var(--board-bg);
    border: 2px solid var(--grid-line);
    border-radius: 8px;
    display: block;
    image-rendering: pixelated;
    touch-action: none;
    max-width: 90vw;
    max-height: 60vh;
  }
  .speed-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    background: var(--board-bg);
    border: 1px solid var(--grid-line);
    border-radius: 8px;
    padding: 12px 10px;
  }
  .speed-panel .panel-label {
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    color: #94a3b8;
    text-transform: uppercase;
  }
  .speed-panel .tick-label {
    font-size: 0.7rem;
    color: #94a3b8;
  }
  .dial-wrap {
    height: 180px;
    width: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #speedDial {
    width: 180px;
    height: 24px;
    margin: 0;
    transform: rotate(-90deg);
    accent-color: var(--accent);
    cursor: pointer;
  }
  #speedValue {
    font-size: 0.85rem;
    font-weight: bold;
    color: var(--accent);
    white-space: nowrap;
  }
  @media (max-width: 560px) {
    .game-area {
      flex-direction: column;
    }
    .speed-panel {
      flex-direction: row;
      width: 100%;
      max-width: 90vw;
      justify-content: center;
    }
    .dial-wrap {
      height: 32px;
      width: 140px;
    }
    #speedDial {
      width: 140px;
      transform: none;
    }
  }
  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 48px);
    grid-template-rows: repeat(3, 48px);
    gap: 4px;
  }
  .dpad button {
    background: var(--board-bg);
    border: 1px solid var(--grid-line);
    color: var(--text);
    border-radius: 6px;
    font-size: 1.2rem;
    cursor: pointer;
    user-select: none;
  }
  .dpad button:active {
    background: var(--accent);
  }
  #up { grid-column: 2; grid-row: 1; }
  #left { grid-column: 1; grid-row: 2; }
  #right { grid-column: 3; grid-row: 2; }
  #down { grid-column: 2; grid-row: 3; }
  .hint {
    font-size: 0.85rem;
    color: #94a3b8;
    text-align: center;
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.9);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    text-align: center;
    padding: 16px;
  }
  #overlay.show { display: flex; }
  #overlay h2 {
    margin: 0;
    font-size: 2rem;
  }
  button.primary {
    background: var(--accent);
    color: #0f172a;
    border: none;
    padding: 10px 24px;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
  }
  button.primary:active {
    opacity: 0.8;
  }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <div class="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
  </div>
  <div class="game-area">
    <canvas id="board"></canvas>
    <div class="speed-panel">
      <span class="panel-label">Speed</span>
      <span class="tick-label">Fast</span>
      <div class="dial-wrap">
        <input type="range" id="speedDial" min="1" max="10" step="1" value="4" aria-label="Snake speed">
      </div>
      <span class="tick-label">Slow</span>
      <span id="speedValue">Normal (4/10)</span>
    </div>
  </div>
  <div class="controls">
    <div class="dpad">
      <button id="up" aria-label="Up">&#8593;</button>
      <button id="left" aria-label="Left">&#8592;</button>
      <button id="right" aria-label="Right">&#8594;</button>
      <button id="down" aria-label="Down">&#8595;</button>
    </div>
    <p class="hint">Arrow keys / WASD to move · Space to pause · tap buttons on mobile</p>
  </div>

  <div id="overlay">
    <h2 id="overlayTitle">Snake</h2>
    <p id="overlayMessage">Press start to play</p>
    <button class="primary" id="startBtn">Start Game</button>
  </div>

<script>
(function () {
  const GRID_SIZE = 20;
  const CELL = 24;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  canvas.width = GRID_SIZE * CELL;
  canvas.height = GRID_SIZE * CELL;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayMessage = document.getElementById('overlayMessage');
  const startBtn = document.getElementById('startBtn');

  const BEST_KEY = 'snake-best-score';
  let best = Number(localStorage.getItem(BEST_KEY) || 0);
  bestEl.textContent = best;

  let snake, direction, nextDirection, food, score, speed, running, paused, loopId;

  const speedDial = document.getElementById('speedDial');
  const speedValueEl = document.getElementById('speedValue');
  const SPEED_LEVEL_KEY = 'snake-speed-level';
  const SLOWEST_MS = 300;
  const FASTEST_MS = 70;

  // level 1 = slowest, 10 = fastest
  function levelToBaseSpeed(level) {
    return Math.round(SLOWEST_MS - (level - 1) * (SLOWEST_MS - FASTEST_MS) / 9);
  }

  function levelToLabel(level) {
    if (level <= 3) return 'Slow';
    if (level <= 6) return 'Normal';
    if (level <= 8) return 'Fast';
    return 'Very Fast';
  }

  let baseSpeed, minSpeed;

  function applySpeedLevel(level) {
    level = Math.min(10, Math.max(1, level));
    localStorage.setItem(SPEED_LEVEL_KEY, String(level));
    baseSpeed = levelToBaseSpeed(level);
    minSpeed = Math.max(FASTEST_MS, Math.round(baseSpeed / 2));
    speedValueEl.textContent = `${levelToLabel(level)} (${level}/10)`;
    // Changing the dial mid-game takes effect immediately.
    if (running) {
      speed = baseSpeed;
    }
  }

  const initialLevel = Number(localStorage.getItem(SPEED_LEVEL_KEY)) || Number(speedDial.value);
  speedDial.value = initialLevel;
  applySpeedLevel(initialLevel);
  speedDial.addEventListener('input', () => applySpeedLevel(Number(speedDial.value)));

  function resetState() {
    const mid = Math.floor(GRID_SIZE / 2);
    snake = [
      { x: mid - 1, y: mid },
      { x: mid - 2, y: mid },
      { x: mid - 3, y: mid },
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    speed = baseSpeed;
    scoreEl.textContent = score;
    placeFood();
  }

  function placeFood() {
    let candidate;
    do {
      candidate = {
        x: Math.floor(Math.random() * GRID_SIZE),
        y: Math.floor(Math.random() * GRID_SIZE),
      };
    } while (snake.some(s => s.x === candidate.x && s.y === candidate.y));
    food = candidate;
  }

  function draw() {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--board-bg');
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid-line');
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID_SIZE; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--food');
    roundRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4, 6);
    ctx.fill();

    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0
        ? getComputedStyle(document.documentElement).getPropertyValue('--snake-head')
        : getComputedStyle(document.documentElement).getPropertyValue('--snake-body');
      roundRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, 5);
      ctx.fill();
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function step() {
    direction = nextDirection;
    const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

    if (
      head.x < 0 || head.x >= GRID_SIZE ||
      head.y < 0 || head.y >= GRID_SIZE ||
      snake.some(seg => seg.x === head.x && seg.y === head.y)
    ) {
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      speed = Math.max(minSpeed, speed - 2);
      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function tick() {
    if (!running || paused) return;
    step();
    loopId = setTimeout(tick, speed);
  }

  function gameOver() {
    running = false;
    if (score > best) {
      best = score;
      localStorage.setItem(BEST_KEY, String(best));
      bestEl.textContent = best;
    }
    overlayTitle.textContent = 'Game Over';
    overlayMessage.textContent = `Score: ${score} — Press start to try again`;
    startBtn.textContent = 'Restart';
    overlay.classList.add('show');
  }

  function startGame() {
    resetState();
    draw();
    running = true;
    paused = false;
    overlay.classList.remove('show');
    clearTimeout(loopId);
    loopId = setTimeout(tick, speed);
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (!paused) {
      loopId = setTimeout(tick, speed);
    } else {
      clearTimeout(loopId);
    }
  }

  function setDirection(dx, dy) {
    if (!running || paused) return;
    if (direction.x === -dx && direction.y === -dy) return;
    nextDirection = { x: dx, y: dy };
  }

  document.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W': setDirection(0, -1); break;
      case 'ArrowDown': case 's': case 'S': setDirection(0, 1); break;
      case 'ArrowLeft': case 'a': case 'A': setDirection(-1, 0); break;
      case 'ArrowRight': case 'd': case 'D': setDirection(1, 0); break;
      case ' ': e.preventDefault(); togglePause(); break;
    }
  });

  document.getElementById('up').addEventListener('click', () => setDirection(0, -1));
  document.getElementById('down').addEventListener('click', () => setDirection(0, 1));
  document.getElementById('left').addEventListener('click', () => setDirection(-1, 0));
  document.getElementById('right').addEventListener('click', () => setDirection(1, 0));

  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx > 0 ? 1 : -1, 0);
    } else {
      setDirection(0, dy > 0 ? 1 : -1);
    }
    touchStart = null;
  }, { passive: true });

  startBtn.addEventListener('click', startGame);

  resetState();
  draw();
  overlay.classList.add('show');
})();
</script>
</body>
</html>
